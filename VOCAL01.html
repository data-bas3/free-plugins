        const REDIRECT_URL='https://www.youtube.com/watch?v=FR0uVa8TUA8&list=PLKvQqxEMw7LVKNyv99GQv6Qf1RQhrXO75&index=1&t=67s';
        const yoVerify = document.getElementById('yo-verify');
        const yoBadge = document.getElementById('yo-badge');
        const optionYoutube = document.getElementById('option-youtube');
        const youtubeBtn = document.getElementById('youtube-btn');
        const lockSymbol=document.getElementById('lockSymbol');
        const statusText=document.getElementById('statusText');
        const unlockBtn=document.getElementById('unlockBtn');
        const unlockBtnText=document.getElementById('unlockBtnText');
        const secretDisplay=document.getElementById('secretLinkDisplay');
        const copyBtn=document.getElementById('copyLinkBtn');

        function updateVerifyUI(){

            if (linkRevealed && youtubeDone) {
                yoVerify.classList.remove('loading');
                yoBadge.classList.add('verified');
                yoBadge.innerHTML = '✓';
            } else if (youtubeDone && !linkRevealed) {
                yoVerify.classList.add('loading');
                yoBadge.classList.remove('verified');
                yoBadge.innerHTML = '○';
            } else {
                yoVerify.classList.remove('loading');
                yoBadge.classList.remove('verified');
                yoBadge.innerHTML = '○';
            }
        }

        function revealLink(){
            secretDisplay.innerText=FAKE_LINK;
            secretDisplay.style.color='var(--pg-text)';
            secretDisplay.style.fontStyle='normal';
            secretDisplay.style.fontWeight='500';
            copyBtn.disabled=false; copyBtn.classList.add('enabled');
            unlockBtn.disabled=false; unlockBtn.classList.add('active');
            unlockBtnText.innerText='open link';
            lockSymbol.innerText='🔓';
            statusText.innerText='UNLOCKED — your link is ready';
            linkRevealed=true; waitingForUnlock=false;
            if(waitTimeout){clearTimeout(waitTimeout);waitTimeout=null;}
            updateVerifyUI();
        }

        function startWaiting(){
            if(waitingForUnlock||linkRevealed)return;
            waitingForUnlock=true;
            lockSymbol.innerText='⏳';
            statusText.innerText='ACTION REQUIRED — finish the step to unlock';
            updateVerifyUI();
            waitTimeout=setTimeout(()=>{if(!linkRevealed)revealLink();},34000);
        }

        function handleSocialClick(channel){

            if (channel === 'youtube' && !youtubeDone) {
                youtubeDone = true;
                trackEvent('Social Click', 'YouTube', 'YouTube button');
            }
            updateVerifyUI();
            if((youtubeDone)&&!waitingForUnlock&&!linkRevealed) startWaiting();
        }

        youtubeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.open(youtubeBtn.href, '_blank');
            handleSocialClick('youtube');
        });

        optionYoutube.addEventListener('dblclick', (e) => {
            e.preventDefault();
            if (!youtubeDone) {
                youtubeDone = true;
                trackEvent('Social Click', 'YouTube (dblclick)', 'YouTube double-click');
                updateVerifyUI();
                if (!waitingForUnlock && !linkRevealed) startWaiting();
            }
        });

        function handleLinkAction(actionType){
            if(!linkRevealed)return;
            trackEvent('Link Action',actionType,FAKE_LINK);
            window.open(FAKE_LINK,'_blank');
            setTimeout(()=>{window.location.href=REDIRECT_URL;},100);
        }

        copyBtn.addEventListener('click',()=>{
            handleLinkAction('Copy');
            navigator.clipboard.writeText(FAKE_LINK).then(()=>{
                copyBtn.classList.add('copied'); copyBtn.innerHTML='✅ copied!';
            }).catch(()=>alert('Press Ctrl+C to copy'));
        });
        unlockBtn.addEventListener('click',()=>handleLinkAction('Open'));
        secretDisplay.addEventListener('click',()=>handleLinkAction('Open (click on link)'));
        updateVerifyUI();
    })();
    </script>
</body>
</html>
